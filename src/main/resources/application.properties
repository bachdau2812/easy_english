spring.application.name=vocab-app

server.servlet.context-path=/vocab-learning
server.port=8080
server.address=0.0.0.0

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/vocab_app
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=60000
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.repositories.enabled=false

app.time-zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.datasource.hikari.connection-init-sql=SET time_zone='+07:00'

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username: ${SPRING_MAIL_USERNAME}
spring.mail.password: ${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.bachdauduc.vocab_app=TRACE

jwt.signerKey=${JWT_SIGNER_KEY}
jwt.valid-duration=129600

azure_api_key=${AZURE_TRANSLATOR_KEY_1}
azure_endpoint=${AZURE_TRANSLATOR_ENDPOINT}
azure_region=${AZURE_TRANSLATOR_REGION}
