name: Build and deploy Vocab App backend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vocab-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/vocab-backend:${{ github.sha }}

      - name: Config SSH
        run: |
          mkdir -p ~.ssh
          
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
                    chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'EOF'
          
            set -e
          
            cd /home/bachdd/vocab-deploy
          
            echo "Pulling backend image..."
            docker compose pull backend
          
            echo "Starting backend..."
            docker compose up -d backend
          
            echo "Current containers:"
            docker compose ps
          
          EOF